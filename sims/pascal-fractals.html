<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pascal's Triangle &amp; Fractals — All-Science Sims</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="sim-page">
    <a class="sim-back" href="../index.html"><i class="fas fa-arrow-left"></i> Back to catalog</a>

    <div class="sim-header">
      <h1>Pascal's Triangle &amp; Fractals</h1>
      <div class="sim-meta">Mathematics · Combinatorics &amp; Fractals</div>
    </div>

    <div class="sim-description">
      Color the entries of Pascal's triangle by divisibility and Sierpiński's triangle appears out of thin air. Switch the modulus and a different fractal emerges.
    </div>

    <div class="sim-controls">
      <div class="control">
        <label>Rows: <span id="rowsLabel">32</span></label>
        <input type="range" id="rows" min="8" max="64" value="32" step="1">
      </div>
      <div class="control">
        <label>Modulus</label>
        <select id="modulus">
          <option value="2">2 (even / odd)</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="7">7</option>
        </select>
      </div>
      <div class="control">
        <label>Coloring</label>
        <select id="mode">
          <option value="divisible">Divisible by m</option>
          <option value="remainder">Colour by remainder</option>
        </select>
      </div>
    </div>

    <div class="sim-canvas-wrap">
      <canvas id="canvas" width="820" height="600"></canvas>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const rowsInput = document.getElementById('rows');
      const rowsLabel = document.getElementById('rowsLabel');
      const modSel = document.getElementById('modulus');
      const modeSel = document.getElementById('mode');

      const palette = ['#ffffff', '#2c7aa0', '#f5b342', '#1b4a6b', '#8db3d0', '#c76b3b', '#5a8a4a', '#9c5fa6'];

      function draw() {
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);

        const n = parseInt(rowsInput.value, 10);
        const m = parseInt(modSel.value, 10);
        const mode = modeSel.value;

        // Compute triangle mod m
        const tri = [];
        for (let i = 0; i < n; i++) {
          tri.push(new Array(i + 1).fill(1));
          for (let j = 1; j < i; j++) {
            tri[i][j] = (tri[i - 1][j - 1] + tri[i - 1][j]) % m;
          }
        }

        // Fit to canvas
        const cellW = w / n;
        const cellH = h / n;
        const cell = Math.min(cellW, cellH);
        const totalW = cell * n;
        const totalH = cell * n;
        const ox = (w - totalW) / 2;
        const oy = (h - totalH) / 2;

        for (let i = 0; i < n; i++) {
          for (let j = 0; j <= i; j++) {
            const v = tri[i][j];
            let color;
            if (mode === 'divisible') {
              color = (v % m === 0) ? palette[1] : palette[0];
            } else {
              color = palette[v % palette.length];
            }
            ctx.fillStyle = color;
            ctx.fillRect(ox + j * cell, oy + i * cell, cell, cell);
          }
        }

        // subtle grid overlay
        ctx.strokeStyle = 'rgba(0,0,0,0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= n; i++) {
          ctx.beginPath();
          ctx.moveTo(ox + i * cell, oy);
          ctx.lineTo(ox + i * cell, oy + totalH);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(ox, oy + i * cell);
          ctx.lineTo(ox + totalW, oy + i * cell);
          ctx.stroke();
        }
      }

      rowsInput.addEventListener('input', () => {
        rowsLabel.textContent = rowsInput.value;
        draw();
      });
      modSel.addEventListener('change', draw);
      modeSel.addEventListener('change', draw);

      draw();
    })();
  </script>
</body>
</html>
